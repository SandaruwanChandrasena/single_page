<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the page fit the phone screen. Stops pinch zoom so it feels like an app. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Colors the phone's top bar (Android Chrome) -->
  <meta name="theme-color" content="#DCE8F2">

  <!-- Lets it open full screen when added to the home screen (iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Counter">

  <title>Counter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1 class="title">Counter</h1>

    <!-- The number. JavaScript will change this text. -->
    <div class="display">
      <span id="count" class="count">0</span>
    </div>

    <div class="controls">
      <button id="subtractBtn" class="btn btn-minus" aria-label="Subtract one">−</button>
      <button id="addBtn" class="btn btn-plus" aria-label="Add one">+</button>
    </div>

    <button id="resetBtn" class="btn-reset">Reset</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
